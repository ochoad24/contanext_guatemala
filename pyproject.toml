[project]
name = "contanext_guatemala"
authors = [
    { name = "ContaNext", email = "engineering@contanext.invalid" }
]
description = "Localización fiscal y operativa de Guatemala para ContaNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
