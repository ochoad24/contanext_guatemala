[project]
name = "contanext_guatemala"
authors = [{name = "ContaNext", email = "dev@contanext.com"}]
description = "Localización fiscal de Guatemala para ContaNext"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
